[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# Exclude non-package directories from auto-discovery
exclude = ["HW*", "data*", "notebooks*", "dl.egg-info*", "*.egg-info", "lectures*"]

[project]
name = "dl-nlp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "accelerate>=1.13.0",
    "corus>=0.10.0",
    "datasets>=4.8.4",
    "evaluate>=0.4.6",
    "gensim>=4.4.0",
    "gliner>=0.2.24",
    "ipykernel>=7.2.0",
    "jupyter-client>=8.8.0",
    "matplotlib>=3.10.8",
    "natasha>=1.6.0",
    "onnxruntime>=1.19.2,<1.24",
    "navec>=0.10.0",
    "nbclient>=0.10.4",
    "nbformat>=5.10.4",
    "pandas>=2.2.0,<3",
    "pymorphy3>=2.0.6",
    "razdel>=0.5.0",
    "scikit-learn>=1.5.0,<1.8",
    "seaborn>=0.13.2",
    "sentencepiece>=0.2.1",
    "seqeval>=1.2.2",
    "slovnet>=0.6.0",
    "torch>=2.11.0",
    "transformers>=5.4.0",
    "nltk>=3.9.4",
    "torchcrf>=1.1.0",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "N", "UP"]
# Ignore ML/sklearn naming conventions (X, y, X_train, etc.)
ignore = ["N803", "N806", "N816", "N812"]

[tool.ruff]
line-length = 120
exclude = ["lectures*"]

[tool.ruff.format]
quote-style = "double"

[dependency-groups]
dev = [
    "mypy>=1.18.2",
    "pandas-stubs>=2.3.2.250926",
    "pre-commit>=4.3.0",
    "ruff>=0.14.3",
    "ipykernel>=7.1.0",
    "ipywidgets>=8.1.8",
]

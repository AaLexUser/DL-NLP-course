[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# Exclude non-package directories from auto-discovery
exclude = ["HW*", "data*", "notebooks*", "dl.egg-info*", "*.egg-info", "lectures*"]

[project]
name = "dl-nlp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "corus>=0.10.0",
    "ipykernel>=7.2.0",
    "jupyter-client>=8.8.0",
    "matplotlib>=3.10.8",
    "nbclient>=0.10.4",
    "nbformat>=5.10.4",
    "pandas>=3.0.1",
    "pymorphy3>=2.0.6",
    "razdel>=0.5.0",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "N", "UP"]
# Ignore ML/sklearn naming conventions (X, y, X_train, etc.)
ignore = ["N803", "N806", "N816", "N812"]

[tool.ruff]
line-length = 120
exclude = ["lectures*"]

[tool.ruff.format]
quote-style = "double"

[dependency-groups]
dev = [
    "mypy>=1.18.2",
    "pandas-stubs>=2.3.2.250926",
    "pre-commit>=4.3.0",
    "ruff>=0.14.3",
    "ipykernel>=7.1.0",
    "ipywidgets>=8.1.8",
]
